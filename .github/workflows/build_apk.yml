name: Build OfficeSetu APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Install Python Pillow and Fix Config
        run: |
          mkdir -p assets
          pip install Pillow
          
          # पाइथन के जरिए PNG आइकॉन और pubspec.yaml फिक्स करना
          python3 -c "
          import yaml
          from PIL import Image, ImageDraw

          img = Image.new('RGB', (512, 512), color='#1E3A8A')
          d = ImageDraw.Draw(img)
          d.rectangle([120, 120, 392, 392], outline='#FFFFFF', width=24)
          img.save('assets/icon.png')

          with open('pubspec.yaml', 'r') as f:
              try:
                  data = yaml.safe_load(f) or {}
              except:
                  data = {}

          data['name'] = 'officesetu'
          
          if 'environment' not in data or not isinstance(data['environment'], dict):
              data['environment'] = {}
          data['environment']['sdk'] = '>=3.0.0 <4.0.0'

          data['flutter_icons'] = {
              'android': True,
              'ios': False,
              'image_path': 'assets/icon.png'
          }

          with open('pubspec.yaml', 'w') as f:
              yaml.safe_dump(data, f)
          "

      - name: Create Android Platform and Generate Icon
        run: |
          flutter create . --platforms=android
          flutter pub add flutter_launcher_icons:^0.13.1
          flutter pub get
          flutter pub run flutter_launcher_icons:main

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OfficeSetu-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
